# 1.9 验证码 / 风控白名单
# 放在广告拦截规则集之前，防止 Advertising.list 误杀导致
# 登录卡在人机验证转圈转不出来（reCAPTCHA / Cloudflare Turnstile）
# ============================================================

DOMAIN-SUFFIX,recaptcha.net,Auto
DOMAIN-SUFFIX,recaptcha.google.com,Auto
DOMAIN-SUFFIX,gstatic.com,Auto
DOMAIN-SUFFIX,challenges.cloudflare.com,Auto


